name = "Krawcheck"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Krawcheck"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0-rc1"

[[lean_lib]]
name = "Krawcheck"

[[lean_lib]]
name = "Krawcheck_tests"
